<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>Type · Body & Label</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-primary);display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;align-items:baseline;gap:18px;}
  .meta{color:var(--fg-tertiary);font:500 11px/1 var(--font-mono);min-width:170px;flex-shrink:0;}
  .specimen{color:var(--fg-primary);}
</style></head>
<body>
<div class="row"><span class="meta">body-l · 18/500</span><span class="specimen t-body-l">노쇼 1건당 평균 44.3만원의 손실이 발생합니다.</span></div>
<div class="row"><span class="meta">body · 16/500</span><span class="specimen t-body">선결제와 보증금으로 노쇼를 방지하세요.</span></div>
<div class="row"><span class="meta">body-s · 14/500</span><span class="specimen t-body-s">픽업 전날 저녁 8시에 자동으로 알림톡을 보내요.</span></div>
<div class="row"><span class="meta">label-l · 16/600</span><span class="specimen t-label-l">예약 확정하기</span></div>
<div class="row"><span class="meta">label · 14/600</span><span class="specimen t-label">알림톡 보내기</span></div>
<div class="row"><span class="meta">label-s · 12/600</span><span class="specimen t-label-s">확정 대기</span></div>
<div class="row"><span class="meta">caption · 12/500</span><span class="specimen t-caption" style="color:var(--fg-tertiary)">방금 전 · 카카오 알림톡</span></div>
