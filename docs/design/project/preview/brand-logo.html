<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>Brand · Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-primary);}
  .row{display:flex;align-items:center;gap:32px;}
  .swatch{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .pill{padding:18px 22px;border-radius:14px;border:1px solid var(--line-normal);display:flex;align-items:center;justify-content:center;}
  .pill.dark{background:var(--c-neutral-1000);border-color:transparent;}
  .pill.cream{background:var(--bg-hero);}
  .label{color:var(--fg-tertiary);font:500 11px/1 var(--font-sans);letter-spacing:0.04em;text-transform:uppercase;}
</style></head>
<body>
<div class="row">
  <div class="swatch"><div class="pill"><img src="../assets/logo.svg" width="120" alt="logo"></div><span class="label">on white</span></div>
  <div class="swatch"><div class="pill cream"><img src="../assets/logo.svg" width="120" alt="logo"></div><span class="label">on cream</span></div>
  <div class="swatch"><div class="pill dark"><img src="../assets/logo-mark.svg" width="40" alt="mark"></div><span class="label">mark · dark</span></div>
  <div class="swatch"><div class="pill"><img src="../assets/logo-mark.svg" width="40" alt="mark"></div><span class="label">mark · light</span></div>
</div>
</body></html>
