<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:32px;background:var(--bg-secondary);display:flex;gap:24px;align-items:center;justify-content:center;}
  .card{width:130px;height:90px;background:#fff;border-radius:14px;border:1px solid var(--line-subtle);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .name{font:700 13px/1 var(--font-sans);color:var(--fg-primary);}
  .desc{font:500 10px/1 var(--font-mono);color:var(--fg-tertiary);}
</style></head>
<body>
<div class="card" style="box-shadow:var(--shadow-1)"><span class="name">shadow-1</span><span class="desc">input · 1px</span></div>
<div class="card" style="box-shadow:var(--shadow-2)"><span class="name">shadow-2</span><span class="desc">card hover</span></div>
<div class="card" style="box-shadow:var(--shadow-3)"><span class="name">shadow-3</span><span class="desc">dropdown</span></div>
<div class="card" style="box-shadow:var(--shadow-4)"><span class="name">shadow-4</span><span class="desc">modal · sheet</span></div>
</body></html>
